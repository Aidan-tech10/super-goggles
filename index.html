function fresh(a,k){const u=used[k]||(used[k]=[]);if(u.length>=a.length)u.length=0;let i;do{i=Math.floor(Math.random()*a.length)}while(u.includes(i));u.push(i);return a[i]}

function ac(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}return AC}
function tone(f,d=.15,ty="sine",v=.07,w=0){const c=sndOn&&ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+w;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
function applause(l=1.5){const c=sndOn&&ac();if(!c)return;const n=c.sampleRate*l,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2)*(Math.random()>.7?1:.3);const s=c.createBufferSource(),g=c.createGain();g.gain.value=.15;s.buffer=b;s.connect(g);g.connect(c.destination);s.start()}
function noiseHit(t,d,f,v,type="bandpass"){const c=AC,n=Math.max(1,Math.floor(c.sampleRate*d)),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t)}
function drumroll(d=.95){const c=sndOn&&ac();if(!c)return;const t=c.currentTime;for(let i=0;i*.045<d;i++)noiseHit(t+i*.045,.05,1800,.04+.1*(i*.045/d))}

function push(){if(isHost)bcast({k:"state",d:S});render()}

function act(d){if(!S||!Array.isArray(S.players)||!d)return;
 if(d.t=="join"){if(S.phase!="lobby"||S.players.some(p=>p.a==d.a&&p.id!=d.id))return;const ex=S.players.find(p=>p.id==d.id);if(ex)ex.a=d.a;else if(S.players.length<7)S.players.push({id:d.id,a:d.a,pos:0,skip:false,ax:false,done:false})}
 else if(d.t=="leave"){if(S.phase=="lobby")S.players=S.players.filter(p=>p.id!=d.id)}
 else if(d.t=="drop"){const p=S.players.find(q=>q.id==d.id);if(!p)return;if(S.phase=="lobby")S.players=S.players.filter(q=>q!==p);else if(S.phase=="play"){p.gone=true;S.msg=S.players[S.turn]===p?adv(nm(p)+" left the game."):nm(p)+" left the game."}}
 else if(d.t=="start"){if(d.id!=S.host||S.phase!="lobby"||S.players.length<2)return;for(let i=S.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.players[i],S.players[j]]=[S.players[j],S.players[i]]}S.phase="play";S.turn=0;S.die=0;S.msg="Turn order was drawn at random. Everybody starts at the Pond. Good luck!"}
 else if(d.t=="roll"){if(S.phase!="play")return;const p=S.players[S.turn];if(p.id!=d.id)return;doRoll(p)}
 else if(d.t=="again"){if(d.id!=S.host)return;S={phase:"lobby",host:S.host,seq:S.seq,players:S.players.filter(p=>!p.gone).map(p=>({id:p.id,a:p.a,pos:0,skip:false,ax:false,done:false}))}}
 push();if(d.t=="roll"&&S.mv)aiLine(S.mv)}
function doRoll(p){
 const d=1+Math.floor(Math.random()*5),ax=p.ax,path=[];p.ax=false;S.die=d;S.seq=(S.seq||0)+1;S.mv={id:p.id,path,seq:S.seq,d,ev:"plain"};
 let m=nm(p)+" rolled a "+d+". ",extra=false,chopped=false;
 if(p.pos+d>END){S.mv.ev="exact";m+="You need an exact roll to land on the Pond!"}
 else{let hit=0;for(let i=0;i<d;i++){const n=p.pos+1;if(TREE.includes(n)){if(!ax){hit=n;break}chopped=true}p.pos=n;path.push(n)}
  if(hit){const a=Math.max(...AX.filter(x=>x<hit));while(p.pos>a){p.pos--;path.push(p.pos)}p.ax=true;S.mv.ev="tree";m+="A tree blocks the way! You walk back to the ax and grab it."}
  else if(p.pos==END){p.done=true;S.mv.ev="pond";m+="You made it to the Pond! The round finishes so everyone gets the same number of turns."}
  else{const q=p.pos;if(chopped)S.mv.ev="chop";
   if(q==6){p.pos=9;path.push(9);S.mv.ev="bridge";m+="You crossed the bridge to square 9!"}
   else if(AX.includes(q)){p.ax=true;S.mv.ev="ax";m+="You got the ax! Next turn it chops trees and rocks."}
   else if(ROCK.includes(q)){if(ax){S.mv.ev="axrock";m+="You chopped the rock down!"}else{path.push(q-1,q-2);p.pos=q-2;S.mv.ev="rock";m+="There’s a rock in your way! Back 2 spaces."}}
   else if(DUCK.includes(q)){extra=true;S.mv.ev="duck";m+="You found the lost duckling!!! Extra turn!"}
   else if(BANJO.includes(q)){p.skip=true;S.mv.ev="banjo";m+="Banjo time! You lose your next turn."}
   else if(chopped)m+="You chopped the tree down!"}}
 if(!extra)m=adv(m);
 if(S.phase=="won")m+=" Game over: "+winTxt();
 S.msg=m}
function adv(m){const n=S.players.length;let wrapped=false;const out=q=>q.done||q.gone;
 const step=()=>{S.turn=(S.turn+1)%n;if(S.turn==0)wrapped=true};
 const fin=()=>{if(wrapped&&S.players.some(q=>q.done)){S.phase="won";S.winners=S.players.filter(q=>q.done).map(q=>q.id);S.winner=S.winners[0];return true}return false};
 if(S.players.every(q=>q.gone))return m;
 step();if(!fin())while(out(S.players[S.turn])||S.players[S.turn].skip){const q=S.players[S.turn];if(!out(q)&&q.skip){q.skip=false;m+=" "+nm(q)+" loses a turn."}step();if(fin())break}
 return m}
function winTxt(){const W=(S.winners||[]).map(id=>(S.players||[]).find(q=>q.id==id)).filter(Boolean);return W.length>1?W.map(nm).join(" & ")+" tie and share the win!":W.length?nm(W[0])+" wins!":"Game over!"}
/* ---------- networking ---------- */
let peer=null,conns=[],hostConn=null,connecting=false,ctimer=0,lastErr="";
addEventListener("error",e=>{lastErr=(e.message||"unknown")+(e.filename?" @"+e.filename.split("/").pop()+":"+e.lineno:"")});
addEventListener("unhandledrejection",e=>{lastErr=String((e.reason&&e.reason.message)||e.reason)});
function bcast(m,skip){conns.forEach(c=>{if(c.open&&c!==skip)try{c.send(m)}catch(e){}})}
function onMsg(m,from){if(!m)return;
 if(m.k=="act"&&isHost){if(from&&m.d&&m.d.id)from.pid=m.d.id;act(m.d)}
 else if(m.k=="state"&&!isHost&&m.d&&typeof m.d=="object"&&m.d.phase){S=m.d;render()}
 else if(m.k=="react"&&m.from!=me&&["👏","🎉","😮","😂"].includes(m.e)){floatE(m.e);if(isHost)bcast(m,from)}}
function connect(c,host){
 err="";c=c.trim().toUpperCase();if(c.length<3){err="Type a game code first.";return render()}
 if(!window.Peer){err="Online play couldn’t load. Check your internet connection!";return render()}
 const id="pondgame-"+c.toLowerCase();
 const PO={host:"0.peerjs.com",port:443,path:"/",secure:true,config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}]}};
 try{peer=new Peer(host?id:undefined,PO)}catch(e){err="Couldn’t start online play: "+(e.message||e);return render()}
 connecting=true;clearTimeout(ctimer);ctimer=setTimeout(()=>{if(connecting){connecting=false;err="Couldn’t reach the matchmaking server"+(lastErr?" ("+lastErr+")":"")+". Check your internet and try again.";S={phase:"menu"};render()}},12000);
 peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
 peer.on("error",e=>{if(S.phase=="lobby"||S.phase=="play"||S.phase=="won"){lastErr=e.type;return}connecting=false;clearTimeout(ctimer);err=e.type=="peer-unavailable"?"No game found with that code.":e.type=="unavailable-id"?"That code is taken, please try again!":"Couldn’t connect ("+e.type+").";S={phase:"menu"};render()});
 peer.on("open",()=>{connecting=false;clearTimeout(ctimer);err="";code=c;isHost=host;local=false;
  if(host){S={phase:"lobby",host:me,players:[]};say("Welcome to the show! Share code "+c+" so your friends can join!");
   peer.on("connection",cn=>{conns.push(cn);cn.on("open",()=>cn.send({k:"state",d:S}));cn.on("data",m=>onMsg(m,cn));cn.on("close",()=>{conns=conns.filter(x=>x!==cn);if(cn.pid)act({t:"drop",id:cn.pid})})});render()}
  else{S={phase:"wait"};hostConn=peer.connect(id,{reliable:true});hostConn.on("data",m=>onMsg(m));hostConn.on("close",()=>{err="The host left the game.";S={phase:"menu"};render()});render()}})}
const SITE="https://aidan-tech10.github.io/super-goggles/";
const inviteText=()=>"Do you want to play The Pond with me? If so go to "+SITE+" and enter the code "+code;
function shareSms(){const t=inviteText(),mob=/iPhone|iPad|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));

function saveCard(){const c=document.createElement("canvas");c.width=900;c.height=520;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,900,520);
 g.addColorStop(0,"#175064");g.addColorStop(1,"#08181f");x.fillStyle=g;x.fillRect(0,0,900,520);
 x.strokeStyle="#ffd54f";x.lineWidth=10;x.lineCap="round";x.setLineDash([2,22]);x.strokeRect(24,24,852,472);x.setLineDash([]);
 x.textAlign="center";const F='Quicksand,"Avenir Next","Trebuchet MS",sans-serif';
 x.fillStyle="#ffd54f";x.font="bold 56px "+F;x.fillText("🐸 THE POND!",450,115);
 x.fillStyle="#e8f5f6";x.font="500 40px "+F;x.fillText("Your code to Lily Pond is",450,215);
 x.fillStyle="#ffd54f";x.font="bold 160px "+F;x.fillText(code,450,375);

 c.toBlob(b=>{const f=new File([b],"pond-invite-"+code+".png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text:inviteText()}).catch(()=>{});

const HOST_AI_URL="";
async function aiLine(mv){if(!HOST_AI_URL||!isHost)return;const p=(S.players||[]).find(q=>q.id==mv.id),nx=(S.players||[])[S.turn];if(!p)return;
 try{const r=await fetch(HOST_AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({animal:AN[p.a][0],ev:S.phase=="won"&&p.done?"win":mv.ev,d:mv.d,pos:Math.min(30,p.pos),next:nx?AN[nx.a][0]:""})});
  const j=await r.json();if(j&&typeof j.line=="string"&&j.line&&S.mv&&S.mv.seq==mv.seq){S.mv.line=j.line.slice(0,160);push()}}catch(e){}}
function mkGame(){connect(Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join(""),true)}

function pick(a){if(local){const ex=(S.players||[]).find(p=>p.a==a);send(ex?{t:"leave",id:ex.id}:{t:"join",id:"L"+a,a})}else send({t:"join",id:me,a})}
const canRoll=()=>S.phase=="play"&&!busy&&(local||S.players[S.turn].id==me);

function sq(i){const t=i==0?"🐸 The Pond: start here, and land here exactly to win!":i==6?"🌉 Bridge: land on 6 and hop across to 9!":i==9?"🌉 Bridge exit: you arrive here from square 6.":AX.includes(i)?"🪓 Ax: grab it! Next turn it chops trees and rocks (1 turn only).":TREE.includes(i)?"🌳 Tree: blocks the way unless you hold the ax. Blocked? You walk back to the ax.":ROCK.includes(i)?"🪨 Rock: go back 2 spaces (the ax smashes it).":DUCK.includes(i)?"🐥 Lost duckling: extra turn!":BANJO.includes(i)?"🪕 Banjo: you lose your next turn.":"A calm little square. Keep swimming!";info="Square "+i+": "+t;const e=$("#info");if(e)e.textContent=info;sfx("tick")}
/* ---------- animation ---------- */
function sync(){const P=S.players||[],now=performance.now();
 if(lastSeq<0&&S.phase!="menu"&&S.phase!="wait")lastSeq=S.mv?S.mv.seq:0;
 if(S.mv&&S.mv.seq>lastSeq){lastSeq=S.mv.seq;const p=P.find(q=>q.id==S.mv.id);
  if(p&&dpos[p.id]!==undefined){anim[p.id]={q:S.mv.path.slice(),h:null,pause:now+1000,n:0};rollUntil=now+950;lastMv=S.mv;say(fresh(LINES.start,"start").replace(/\{n\}/g,AN[p.a][0]));sfx("roll")}}
 if(S.phase=="play"&&prevPhase=="lobby"){sfx("fanfare");say("Ladies and gentlemen, welcome to THE POND! Contestants, take your places! "+AN[P[0].a][0]+" goes first!")}
 prevPhase=S.phase;
 P.forEach(p=>{const a=anim[p.id];if(!(a&&active(a)))dpos[p.id]=p.pos});
 busy=Object.values(anim).some(active);P.forEach(p=>rs[p.id]=dpos[p.id])}
function finish(){const mv=lastMv;lastMv=null;if(!mv)return;const p=(S.players||[]).find(q=>q.id==mv.id);if(!p)return;const ai=S.mv&&S.mv.seq==mv.seq?S.mv.line:"";
 const good=["ax","bridge","duck","chop","axrock","win"].includes(mv.ev),bad=["tree","rock","banjo","exact"].includes(mv.ev);
 if(S.phase=="won"&&S.mv&&S.mv.seq==mv.seq){sfx("win");say(winTxt()+" "+(ai||fresh(LINES.win,"win")))}
 else if(mv.ev=="pond"){sfx("good");applause(1);cheerA();say(AN[p.a][0]+" made it to the Pond! "+(ai||fresh(LINES.pond,"pond"))+" The round finishes so everyone gets equal turns.")}
 else{sfx(good?"good":bad?"bad":"pop");if(good){applause(1);cheerA()}const nx=S.players[S.turn];say(AN[p.a][0]+"! "+(ai||pickLine(mv,p))+(mv.ev=="duck"?"":" Next up: "+AN[nx.a][0]+"."))}}
function tick(ts){
 const d=$("#die");if(rollUntil){if(ts<rollUntil){if(d&&ts-lastDie>70){d.textContent="🎲 "+(1+Math.floor(Math.random()*5));lastDie=ts}}else{rollUntil=0;if(d&&S.die)d.textContent="🎲 "+S.die}}
 for(const id in anim){const a=anim[id];
  if(!a.h&&a.q.length&&ts>a.pause){a.h={from:dpos[id],to:a.q.shift(),t0:ts};sfx("hop",++a.n)}
  if(a.h){const u=Math.min(1,(ts-a.h.t0)/480),f=ctr(a.h.from),t=ctr(a.h.to),rc=ctr(rs[id]??a.h.from);
   const x=f[0]+(t[0]-f[0])*u-rc[0],y=f[1]+(t[1]-f[1])*u-26*Math.sin(Math.PI*u)-rc[1];
   const el=document.getElementById("t-"+id);if(el)el.setAttribute("transform","translate("+x+" "+y+")");
   if(u>=1){dpos[id]=a.h.to;a.h=null;a.pause=ts+160}}}
 const b=Object.values(anim).some(active);
 if(prevBusy&&!b){for(const id in anim)delete anim[id];finish();render()}
 prevBusy=b;requestAnimationFrame(tick)}
/* ---------- drawing ---------- */
function board(){
 let s='<svg viewBox="0 0 700 490" role="img" aria-label="The Pond game board">';
 for(let i=0;i<30;i++){const[c,r]=xy(i),x=c*70,y=r*70;let f=PAL[i%6],e="";
  if(i==6||i==9)f="#111";else if(BANJO.includes(i)||DUCK.includes(i)||AX.includes(i)){f="#7e57c2";e=BANJO.includes(i)?"🪕":DUCK.includes(i)?"🐥":"🪓"}
  else if(TREE.includes(i)){f="#fdd835";e="🌳"}else if(ROCK.includes(i)){f="#8d6e63";e="🪨"}
  if(i==0)f="#7bd88f";
  s+=`<rect x="${x}" y="${y}" width="70" height="70" fill="${f}" stroke="#0a2a35" stroke-width="2" onclick="sq(${i})"/>`;
  if(i==0)s+=`<circle cx="${x+35}" cy="${y+35}" r="30" fill="#4fb3f6"/><text x="${x+35}" y="${y+40}" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b2a4a">The Pond</text>`;
  else s+=`<text x="${x+34}" y="${y+46}" text-anchor="middle" font-size="30">${e}</text><text x="${x+5}" y="${y+14}" font-size="11" fill="#fff">${i}</text>`}
 s+='<path d="M35 35 Q140 175 245 35" fill="none" stroke="#a1662f" stroke-width="30" stroke-dasharray="6 3"/><text x="140" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">bridge 6→9</text>';
 s+='<text x="350" y="215" text-anchor="middle" font-size="64" font-weight="bold" fill="#e8f5f6">The Pond!</text><path d="M200 235 q15 -12 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="#e8f5f6" stroke-width="5" fill="none"/><text x="350" y="300" text-anchor="middle" font-size="46">🐟</text>';
 const P=S.players||[],at={};P.forEach(p=>{const i=(dpos[p.id]??p.pos)%30;(at[i]=at[i]||[]).push(p)});
 for(const i in at){const[cx,cy]=xy(+i);at[i].forEach((p,j)=>{const x=cx*70+16+(j%3)*19,y=cy*70+20+Math.floor(j/3)*20,cur=S.phase=="play"&&S.players[S.turn]===p;
  s+=`<g class="tok${cur?" act":""}" id="t-${p.id}"><circle cx="${x}" cy="${y}" r="9.5" fill="#fff" stroke="${AN[p.a][2]}" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13">${AN[p.a][1]}</text>${p.ax?`<text x="${x+7}" y="${y-8}" font-size="10">🪓</text>`:""}${p.skip?`<text x="${x+7}" y="${y-8}" font-size="10">💤</text>`:""}</g>`})}
 return s+'</svg>'}
function render(){if(!S||typeof S!="object"||!S.phase)S={phase:"menu"};if(["lobby","play","won"].includes(S.phase)){if(!Array.isArray(S.players))S.players=[];if(S.phase!="lobby"&&!S.players.length)S={phase:"menu"};else if(!S.players[S.turn])S.turn=0}
 sync();const a=$("#app");
 let h=`<div class="marq">THE POND!</div><div class="hostrow"><div id="host" class="${hostShown<hostFull.length?"talk":""}">🐸<small>🎤</small></div><div class="bub"><b>Hopper, your host</b><div id="bubble">${hostFull.slice(0,hostShown)}</div></div></div>`;
 if(S.phase=="menu")h+=`<div class="card"><p>Race all the way around the pond and land back on <b>The Pond</b> to win!</p><button onclick="mkGame()">🌐 Create online game</button><br><input id="jc" maxlength="6" placeholder="CODE"><button class="alt" onclick="connect($('#jc').value,false)">Join</button><br><button class="alt" onclick="localGame()">👥 Pass &amp; play on this device</button><p class="err">${err}</p></div>`;
 else if(S.phase=="wait")h+=`<div class="card">Joined game <b>${code}</b>… waiting for the host 🐚</div>`;
 else if(S.phase=="lobby")h+=`<div class="card">${local?"Pick everyone’s ocean animal (tap again to remove).":"Game code: <b style='font-size:2rem;letter-spacing:4px'>"+code+"</b><br>Friends open this page, tap Join, and type the code."}${!local&&isHost?`<br><button onclick="shareSms()">💬 Share with friends</button><button class="alt" onclick="saveCard()">🎟️ Save invite card</button>`:""}<div class="grid">${AN.map((x,i)=>{const o=S.players.find(p=>p.a==i),mine=o&&(local||o.id==me);return `<button class="pick alt" style="border-color:${x[2]}" ${o&&!mine?"disabled":""} onclick="pick(${i})"><span>${x[1]}</span>${x[0]}${mine?" ✓":""}</button>`}).join("")}</div><p>${S.players.length} player${S.players.length==1?"":"s"} (2–7)</p>${isHost?`<button onclick="send({t:'start',id:me})" ${S.players.length<2?"disabled":""}>Start the show!</button>`:"<p>Waiting for the host to start…</p>"}</div>`;
 else{const p=S.players[S.turn],w=S.players.find(q=>q.id==S.winner),can=canRoll();
  h+=`<div class="board">${board()}</div><div class="card"><div style="font-size:1.25rem">${S.phase=="won"?"🏆 "+winTxt():"Now playing: <b style='color:${AN[p.a][2]}'>"+nm(p)+"</b>"+(p.ax?" 🪓":"")}</div>
  ${S.phase=="play"?`<button id="die" ${can?"":"disabled"} onclick="roll()">${rollUntil?"🎲":S.die?"🎲 "+S.die:"🎲"}</button><div class="small">${can?"Tap the dice or press Space!":busy?"Watch the hops…":"Waiting for "+AN[p.a][0]+"…"}</div>`:(isHost?`<button onclick="send({t:'again',id:me})">Play again</button>`:"")}
  <p id="info" class="small">${info}</p><p>${S.msg||""}</p></div>
  <div class="card">${S.players.map(q=>`<div class="pl${q===p&&S.phase=="play"?" cur":""}"><span>${nm(q)}${q.done?" 🏁":""}${q.gone?" 🚪":""}${q.ax?" 🪓":""}${q.skip?" 💤":""}${!local&&q.id==me?" (you)":""}</span><i><u style="width:${Math.round(q.pos*100/30)}%;background:${AN[q.a][2]}"></u></i></div>`).join("")}</div>`;
  if(S.phase=="won"&&!busy){h+=`<div id="win"><div class="dancer" style="font-size:${(S.winners||[]).length>2?5:(S.winners||[]).length>1?6.5:9}rem">${(S.winners||[]).map(id=>{const x=S.players.find(q=>q.id==id);return x?AN[x.a][1]:""}).join("")}</div><h1>🎉 ${winTxt()} 🎉</h1><p style="font-size:1.3rem">${hostFull}</p>${isHost?`<button onclick="send({t:'again',id:me})">Play again</button>`:""}</div>`;startConfetti()}else confettiOn=false}
 h+=`<div id="aud" class="aud">${["🐧","🦦","🐠","🐢","🦀","🐙","🐬"].map((e,i)=>`<span style="animation-delay:${i*.18}s">${e}</span>`).join("")}</div><div>${["👏","🎉","😮","😂"].map(e=>`<button class="alt" onclick="react('${e}')">${e}</button>`).join("")}<button class="alt" onclick="tog('s')">${sndOn?"🔊":"🔇"} Sound</button></div>`;
 a.innerHTML=h}
function startConfetti(){if(confettiOn)return;confettiOn=true;const cv=$("#cv"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
 const P=Array.from({length:180},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,v:2+Math.random()*4,s:5+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6}));
 (function f(){x.clearRect(0,0,cv.width,cv.height);if(!confettiOn)return;P.forEach(q=>{q.y+=q.v;q.r+=.1;q.x+=Math.sin(q.r)*2;if(q.y>cv.height){q.y=-10;q.x=Math.random()*cv.width}x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s*.6)});requestAnimationFrame(f)})()}
